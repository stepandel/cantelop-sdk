[package]
name = "cantelop-codex-workspace"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
futures-core = "0.3"
futures-util = "0.3"
base64 = "0.22"
log = "0.4"
sqlx-core = { version = "=0.9.0", default-features = false, features = ["migrate", "offline"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "migrate"] }
tokio = { version = "1", features = ["sync", "rt", "macros", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread"] }
