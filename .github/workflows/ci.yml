name: SDK CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
      - uses: oven-sh/setup-bun@v2
      - run: corepack enable
      # Build once: every later step runs against this dist.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build:release
      - run: pnpm test:built
      - run: bun test test/bun/subprocess.test.mjs
      - run: pnpm check:examples:built
      - run: pnpm check:package --prebuilt
