name: Native Codex workspace backend
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'native/**'
      - 'src/codex*.ts'
      - 'scripts/*codex*.mjs'
      - '.github/workflows/codex-native.yml'
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Install the pinned Rust compiler
        run: rustup toolchain install 1.95.0 --profile minimal
      - name: Build the SDK
        run: pnpm build
      - name: Prepare pinned upstream source
        run: node scripts/build-codex.mjs --prepare-only
      - name: Verify the SQLx driver and migrations
        run: |
          pnpm check:codex-native
          pnpm check:codex-native "$PWD/native/build/codex"
      - name: Build native harness
        run: pnpm build:codex
      - name: Verify native turn and process restart
        run: pnpm check:codex-harness
      - uses: actions/upload-artifact@v4
        with:
          name: cantelop-codex-linux-x64
          path: native/bin/cantelop-codex
          if-no-files-found: error
