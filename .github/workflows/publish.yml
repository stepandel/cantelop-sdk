name: Publish SDK

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package version to publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Enable pinned package manager
        run: corepack enable

      - name: Require the requested version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          expected_ref="refs/tags/sdk-v${REQUESTED_VERSION}"
          test "${GITHUB_REF}" = "${expected_ref}"
          test "${GITHUB_REF_TYPE}" = "tag"
          test "$(git cat-file -t "${GITHUB_REF_NAME}")" = "tag"
          git merge-base --is-ancestor HEAD origin/main
          package_version="$(node -p 'require("./package.json").version')"
          test "${REQUESTED_VERSION}" = "${package_version}"

      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm check:examples
      - run: pnpm check:package

      - name: Publish release candidate
        if: contains(inputs.version, '-')
        run: npm publish --access public --tag next

      - name: Publish stable release
        if: ${{ !contains(inputs.version, '-') }}
        run: npm publish --access public

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          args=(--verify-tag --generate-notes --title "SDK ${RELEASE_VERSION}")
          if [[ "${RELEASE_VERSION}" == *-* ]]; then
            args+=(--prerelease --latest=false)
          fi
          gh release create "${RELEASE_TAG}" "${args[@]}"
