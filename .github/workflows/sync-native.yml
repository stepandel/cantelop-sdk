name: Native SDK sync

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  sync:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build
      - name: Test native filesystem guarantees
        working-directory: native
        run: go test ./... github.com/stepandel/cantelop/fire-fuse/workspacesync github.com/stepandel/cantelop/fire-fuse/syncprotocol
      - run: node --test test/sync.test.mjs
